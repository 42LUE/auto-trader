# Runs the bot once a day after the UTC daily candle closes (11:15am Sydney in summer).
# Paper mode needs no secrets. Kraken's public API works from GitHub's US runners;
# Binance does NOT (it blocks US IPs) - run Binance from your own PC instead.
name: daily-trader
on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch: {}
concurrency: trader   # never two runs at once
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Run one cycle
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Live mode only (leave these secrets unset while paper trading):
          TRADER_API_KEY: ${{ secrets.TRADER_API_KEY }}
          TRADER_API_SECRET: ${{ secrets.TRADER_API_SECRET }}
          TRADER_LIVE_CONFIRM: ${{ secrets.TRADER_LIVE_CONFIRM }}
        run: python bot.py run && python bot.py status
      - name: Daily summary (+ weekly on Sundays)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python summary.py daily
          if [ "$(date -u +%u)" = "7" ]; then python summary.py weekly; fi
      - name: Commit ledger
        run: |
          git config user.name "trader-bot"
          git config user.email "trader-bot@users.noreply.github.com"
          git add state/ reports/
          git diff --cached --quiet || git commit -m "daily run $(date -u +%F)"
          git push
