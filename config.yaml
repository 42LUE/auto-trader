# ---- $20 auto-trader config ------------------------------------------------
# Changing this file = a pull request Kaileb merges. Claude never pushes it to main.

exchange: kraken            # any ccxt id. kraken works from GitHub Actions.
symbol: BTC/AUD

accounts:
  claude:                   # trades for Kaileb: executes ONLY decisions he approved
    mode: paper             # paper | live
    live_approved: false    # Kaileb flips this. Live also needs secret
                            # TRADER_LIVE_CONFIRM=I_APPROVE_REAL_MONEY
  rule:                     # benchmark, always paper, fully automatic
    strategy: trend_ensemble_half
    strategy_params: {}

start_capital: 20.0         # each account starts with this (AUD)
max_capital: 20.0           # live: never manage more than this
allowed_exposures: [0.0, 0.5, 1.0]   # Claude can only propose these
kill_switch_equity: 0.0     # Kaileb's rule: shut down at $0
pause_drawdown: 0.30        # -30% from peak -> go to cash, wait for Kaileb
min_rebalance: 0.20

approver: 42LUE             # only PR merges by this GitHub user count as YES

# Approved proposals execute only if still fresh and the price hasn't run away
proposal_expiry_hours: 36
proposal_max_price_move: 0.05

# Paper fill cost per side (fee + slippage). 0.009 ~ Kraken AU tier-1 taker.
paper_cost_per_side: 0.009

ntfy_topic: ""              # or repo secret NTFY_TOPIC
